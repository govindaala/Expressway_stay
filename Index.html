<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Expressway Stay & Food | Live GPS & Reviews</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 pb-24" x-data="travellerPortal()" x-init="initPortal()" x-cloak>

  <!-- टॉप हेडर -->
  <header class="bg-slate-950 text-white px-4 py-3 flex items-center justify-between text-xs sticky top-0 z-40 border-b border-slate-800 shadow-md">
    <div class="flex items-center gap-2 font-bold tracking-wide">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>EXPRESSWAY STAY & FOOD LIVE</span>
    </div>
    <button @click="refreshAll()" class="text-[11px] bg-slate-800 active:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 font-semibold flex items-center gap-1">
      <span>🔄</span> रीफ़्रेश
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-3.5">
    
    <!-- GPS स्टेटस बार -->
    <div class="p-3 rounded-2xl text-xs flex items-center justify-between shadow-sm border"
         :class="userLat ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'">
      <div class="flex items-center gap-2">
        <span class="text-base" x-text="userLat ? '📍' : '⏳'"></span>
        <div>
          <span class="font-black block" x-text="userLat ? 'आपकी लाइव लोकेशन डिटेक्ट हो गई है' : 'GPS लोकेशन खोजी जा रही है...'"></span>
          <span class="text-[10px] text-slate-500" x-text="userLat ? 'सबसे नज़दीकी होटल और रेस्टोरेंट सबसे ऊपर दिख रहे हैं' : 'कृपया ब्राउज़र में लोकेशन अनुमति (Allow) दें'"></span>
        </div>
      </div>
      <button x-show="!userLat" @click="getUserGps()" class="bg-amber-500 text-slate-950 font-bold px-2.5 py-1 rounded-lg text-[10px]">
        GPS ऑन करें
      </button>
    </div>

    <!-- होटल बनाम रेस्टोरेंट टैब -->
    <div class="grid grid-cols-2 gap-2 bg-slate-200 p-1.5 rounded-2xl">
      <button @click="activeCategory = 'hotel'" :class="activeCategory === 'hotel' ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-300/60'" class="py-2.5 rounded-xl font-black text-xs transition flex items-center justify-center gap-1.5">
        <span>🏨</span> होटल (कमरे / Stay)
      </button>
      <button @click="activeCategory = 'restaurant'" :class="activeCategory === 'restaurant' ? 'bg-orange-600 text-white shadow-md' : 'text-slate-700 hover:bg-slate-300/60'" class="py-2.5 rounded-xl font-black text-xs transition flex items-center justify-center gap-1.5">
        <span>🍽️</span> रेस्टोरेंट / ढाबा (खाना)
      </button>
    </div>

    <!-- सर्च बार -->
    <div class="relative">
      <input type="text" x-model="searchQuery" placeholder="होटल, ढाबा या शहर का नाम खोजें..." class="w-full bg-white border border-slate-300 rounded-2xl py-3 pl-10 pr-4 text-xs font-semibold placeholder:text-slate-400 outline-none focus:border-indigo-600 shadow-sm">
      <span class="absolute left-3.5 top-3 text-slate-400 text-sm">🔍</span>
      <button x-show="searchQuery" @click="searchQuery = ''" class="absolute right-3 top-2.5 text-xs text-slate-400 bg-slate-100 rounded-full w-5 h-5 flex items-center justify-center">✕</button>
    </div>

    <!-- लोडिंग -->
    <div x-show="loading" class="text-center py-10">
      <div class="inline-block w-8 h-8 border-4 border-slate-300 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="text-xs text-slate-500 mt-2 font-medium">डेटा लोड हो रहा है...</p>
    </div>

    <!-- होटल व ढाबा कार्ड्स -->
    <div x-show="!loading" class="space-y-3.5">
      <template x-for="item in sortedAndFilteredList" :key="item.login_id">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3 relative">
          
          <!-- नज़दीकी दूरी का बैज -->
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-base" x-text="item.category === 'restaurant' ? '🍽️' : '🏨'"></span>
                <h3 class="font-extrabold text-slate-900 text-sm" x-text="item.name"></h3>
              </div>
              <p class="text-xs text-slate-500 font-medium mt-0.5 flex items-center gap-1">
                <span x-text="'📍 ' + item.city"></span>
                <template x-if="item.distanceKm !== null">
                  <span class="bg-indigo-50 text-indigo-700 font-extrabold px-2 py-0.5 rounded-md text-[10px] ml-1" x-text="item.distanceKm + ' km दूर'"></span>
                </template>
              </p>
            </div>

            <!-- शुरुआती रेट -->
            <div class="text-right whitespace-nowrap">
              <span class="text-[10px] text-slate-400 block font-medium" x-text="item.category === 'restaurant' ? 'शुरुआती थाली' : 'कमरा किराया'"></span>
              <span class="text-sm font-black text-emerald-600" x-text="'₹' + (item.starting_price || 1500)"></span>
            </div>
          </div>

          <!-- रेटिंग और रिव्यू समरी बार -->
          <div class="flex items-center justify-between bg-slate-50 border border-slate-100 p-2 rounded-xl text-xs">
            <div class="flex items-center gap-1">
              <span class="text-amber-500 font-black">★</span>
              <span class="font-bold text-slate-800" x-text="item.avgRating ? item.avgRating.toFixed(1) : 'नया'"></span>
              <span class="text-slate-400 text-[11px]" x-text="'(' + (item.reviewCount || 0) + ' रिव्यू)'"></span>
            </div>
            <button @click="openReviewModal(item)" class="text-indigo-600 hover:text-indigo-800 font-bold text-[11px] underline">
              रिव्यू दें / पढ़ें ➔
            </button>
          </div>

          <!-- कमरा स्थिति (होटल) -->
          <template x-if="item.category !== 'restaurant'">
            <div class="p-2 rounded-xl border flex items-center justify-between" :class="Number(item.available_rooms) > 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full" :class="Number(item.available_rooms) > 0 ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'"></span>
                <span class="text-xs font-bold" :class="Number(item.available_rooms) > 0 ? 'text-emerald-900' : 'text-rose-900'" x-text="Number(item.available_rooms) > 0 ? 'कमरे उपलब्ध हैं' : 'हाउसफुल (Sold Out)'"></span>
              </div>
              <span class="text-xs font-mono font-black" :class="Number(item.available_rooms) > 0 ? 'text-emerald-700' : 'text-rose-700'" x-text="item.available_rooms + ' / ' + item.total_rooms + ' खाली'"></span>
            </div>
          </template>

          <!-- टेकअवे स्थिति (रेस्टोरेंट) -->
          <template x-if="item.category === 'restaurant'">
            <div class="p-2 rounded-xl border bg-orange-50 border-orange-200 flex items-center justify-between text-xs">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-orange-500 animate-pulse"></span>
                <span class="font-bold text-orange-900">डाइनिंग व भोजन सेवा चालू</span>
              </div>
              <span class="text-[10px] font-bold text-orange-700 bg-orange-100 px-2 py-0.5 rounded">शुद्ध खाना</span>
            </div>
          </template>

          <!-- कॉल और नेविगेशन एक्शन बटन्स -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <a :href="'tel:' + item.phone" class="bg-slate-900 active:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow">
              <span>📞</span> कॉल करें
            </a>
            <a :href="'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.name + ' ' + item.city)" target="_blank" class="bg-indigo-50 active:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5">
              <span>🧭</span> मैप दिशा
            </a>
          </div>

        </div>
      </template>
    </div>
  </main>

  <!-- रिव्यू और रेटिंग मोडल (पॉपअप) -->
  <div x-show="activeHotelForReview" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto space-y-4 shadow-2xl">
      
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <span class="text-[10px] uppercase font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">पब्लिक रिव्यू और रेटिंग</span>
          <h3 class="text-base font-extrabold text-slate-900 mt-1" x-text="activeHotelForReview?.name"></h3>
        </div>
        <button @click="activeHotelForReview = null" class="text-slate-400 hover:text-slate-700 text-lg font-bold bg-slate-100 rounded-full w-7 h-7 flex items-center justify-center">✕</button>
      </div>

      <!-- रेटिंग फॉर्म -->
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
        <h4 class="text-xs font-black text-slate-800">★ अपनी रेटिंग और अनुभव साझा करें</h4>
        
        <!-- स्टार सेलेक्शन -->
        <div class="flex items-center gap-2">
          <template x-for="star in [1, 2, 3, 4, 5]" :key="star">
            <button @click="newReview.rating = star" type="button" class="text-2xl transition transform active:scale-125" :class="star <= newReview.rating ? 'text-amber-400' : 'text-slate-300'">
              ★
            </button>
          </template>
          <span class="text-xs font-bold text-slate-600 ml-2" x-text="newReview.rating + ' स्टार'"></span>
        </div>

        <div class="space-y-2">
          <input type="text" x-model="newReview.userName" placeholder="आपका पूरा नाम (पब्लिक दिखेगा) *" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600">
          <input type="email" x-model="newReview.userEmail" placeholder="आपका ईमेल (पब्लिक दिखेगा / Google ID) *" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600 font-mono">
          <textarea x-model="newReview.comment" rows="2" placeholder="यहाँ अपने अनुभव के बारे में लिखें (कमरे, खाना, स्वच्छता आदि)..." class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600"></textarea>
        </div>

        <p class="text-[10px] text-slate-500">
          ⚠️ पारदर्शी समीक्षा के लिए आपका नाम और ईमेल सार्वजनिक रूप से प्रकाशित किया जाएगा।
        </p>

        <button @click="submitReview()" :disabled="submittingReview" class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow flex items-center justify-center gap-2">
          <span x-show="!submittingReview">रिव्यू पोस्ट करें</span>
          <span x-show="submittingReview" class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        </button>
      </div>

      <!-- पुराने रिव्यूज़ की सूची -->
      <div class="space-y-2.5">
        <h4 class="text-xs font-black text-slate-800 flex items-center gap-1">
          <span>💬</span> पिछले पब्लिक रिव्यूज़ (<span x-text="currentHotelReviews.length"></span>)
        </h4>

        <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
          <template x-for="rev in currentHotelReviews" :key="rev.id">
            <div class="bg-white border border-slate-200 p-3 rounded-xl space-y-1">
              <div class="flex justify-between items-center text-xs">
                <span class="font-bold text-slate-900" x-text="rev.user_name"></span>
                <span class="text-amber-500 font-bold" x-text="'★'.repeat(rev.rating)"></span>
              </div>
              <span class="text-[10px] font-mono text-slate-400 block" x-text="'✉️ ' + rev.user_email"></span>
              <p class="text-xs text-slate-700 pt-0.5" x-text="rev.comment || 'रेटिंग दर्ज की गई।'"></p>
            </div>
          </template>
          <div x-show="currentHotelReviews.length === 0" class="text-center py-4 text-xs text-slate-400">
            अभी तक कोई रिव्यू नहीं आया है। पहले समीक्षक बनें!
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const TURSO_PIPELINE_URL = "https://expresswaystay-govindaala.aws-ap-south-1.turso.io/v2/pipeline";
    const TURSO_AUTH_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODg5OTE1MzIsImlkIjoiMDFhMDg4MzItM2UwMS03NGY5LTk3NTQtYTg4YjBkZTAyMTA1Iiwia2lkIjoiV0JkNlJ2dHFndUYtOHV1R2tnT0xSWWREU0lCaGVOem8xVy1QNXhBWkNVVSIsInJpZCI6ImE5OWVlZTcxLTNkZGItNDMzMi1hZDU5LTQzZmU4NWIwNjBhNiJ9.2igLL_0RTRvj6QJIq7enEUqoKFkx-v0OOpcL4Gc6dFzdYp3nDfaKyp740YD4B1e5cPnpIbHAy4ihec0vEdgcBg";

    function travellerPortal() {
      return {
        hotels: [],
        reviews: [],
        loading: true,
        activeCategory: 'hotel',
        searchQuery: '',
        userLat: null,
        userLon: null,
        activeHotelForReview: null,
        currentHotelReviews: [],
        submittingReview: false,
        newReview: { rating: 5, userName: '', userEmail: '', comment: '' },

        async initPortal() {
          this.getUserGps();
          await this.fetchAllData();
        },

        async refreshAll() {
          await this.fetchAllData();
        },

        getUserGps() {
          if (!navigator.geolocation) return;
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              this.userLat = pos.coords.latitude;
              this.userLon = pos.coords.longitude;
            },
            (err) => {
              console.log("GPS Denied or Timeout");
            },
            { enableHighAccuracy: true, timeout: 10000 }
          );
        },

        async executeTurso(sqlQuery) {
          const res = await fetch(TURSO_PIPELINE_URL, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${TURSO_AUTH_TOKEN.trim()}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              requests: [
                { type: "execute", stmt: { sql: sqlQuery } },
                { type: "close" }
              ]
            })
          });
          const data = await res.json();
          if (data.results && data.results[0]?.response?.result) {
            const execRes = data.results[0].response.result;
            const cols = (execRes.cols || []).map(c => c.name);
            return (execRes.rows || []).map(row => {
              const obj = {};
              row.forEach((cell, idx) => { obj[cols[idx]] = cell.value; });
              return obj;
            });
          }
          return [];
        },

        async fetchAllData() {
          this.loading = true;
          try {
            // 1. होटल्स लोड
            const hotelRows = await this.executeTurso("SELECT * FROM hotels WHERE is_active = 1");
            
            // 2. रिव्यूज़ लोड
            let reviewRows = [];
            try {
              reviewRows = await this.executeTurso("SELECT * FROM reviews ORDER BY id DESC");
            } catch (e) {
              reviewRows = [];
            }
            this.reviews = reviewRows;

            // रेटिंग कैलकुलेट करके होटल ऑब्जेक्ट में जोड़ना
            this.hotels = hotelRows.map(h => {
              const hReviews = this.reviews.filter(r => r.hotel_id === h.login_id);
              const count = hReviews.length;
              const avg = count > 0 ? (hReviews.reduce((sum, r) => sum + Number(r.rating), 0) / count) : null;
              return {
                ...h,
                category: h.category || 'hotel',
                avgRating: avg,
                reviewCount: count
              };
            });
          } catch (e) {
            console.error(e);
          } finally {
            this.loading = false;
          }
        },

        // दो GPS पॉइंट्स के बीच की दूरी (Haversine Formula)
        calculateDistance(lat1, lon1, lat2, lon2) {
          if (!lat1 || !lon1 || !lat2 || !lon2) return null;
          const R = 6371; // पृथ्वी की त्रिज्या (किमी में)
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLon = (lon2 - lon1) * Math.PI / 180;
          const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          return parseFloat((R * c).toFixed(1));
        },

        get sortedAndFilteredList() {
          const q = this.searchQuery.trim().toLowerCase();
          
          return this.hotels
            .filter(item => {
              const matchCat = (this.activeCategory === 'restaurant') ? (item.category === 'restaurant') : (item.category !== 'restaurant');
              const matchQuery = !q || (item.name && item.name.toLowerCase().includes(q)) || (item.city && item.city.toLowerCase().includes(q));
              return matchCat && matchQuery;
            })
            .map(item => {
              let dist = null;
              if (this.userLat && this.userLon && item.lat && item.lon) {
                dist = this.calculateDistance(this.userLat, this.userLon, Number(item.lat), Number(item.lon));
              }
              return { ...item, distanceKm: dist };
            })
            .sort((a, b) => {
              // दूरी के हिसाब से सॉर्टिंग (पास वाला पहले)
              if (a.distanceKm !== null && b.distanceKm !== null) return a.distanceKm - b.distanceKm;
              if (a.distanceKm !== null) return -1;
              if (b.distanceKm !== null) return 1;
              return 0;
            });
        },

        openReviewModal(hotel) {
          this.activeHotelForReview = hotel;
          this.currentHotelReviews = this.reviews.filter(r => r.hotel_id === hotel.login_id);
          this.newReview = { rating: 5, userName: '', userEmail: '', comment: '' };
        },

        async submitReview() {
          if (!this.newReview.userName || !this.newReview.userEmail) {
            alert('कृपया अपना नाम और ईमेल आईडी दर्ज करें!');
            return;
          }
          if (!this.newReview.userEmail.includes('@')) {
            alert('कृपया मान्य ईमेल आईडी लिखें!');
            return;
          }

          this.submittingReview = true;
          const cName = this.newReview.userName.trim().replace(/'/g, "''");
          const cEmail = this.newReview.userEmail.trim().replace(/'/g, "''");
          const cComm = (this.newReview.comment || '').trim().replace(/'/g, "''");
          const hId = this.activeHotelForReview.login_id;
          const star = this.newReview.rating;

          const sql = `INSERT INTO reviews (hotel_id, user_name, user_email, rating, comment)
                       VALUES ('${hId}', '${cName}', '${cEmail}', ${star}, '${cComm}')`;

          try {
            await this.executeTurso(sql);
            alert('✅ आपका पब्लिक रिव्यू और रेटिंग सफलतापूर्वक दर्ज हो गई!');
            await this.fetchAllData();
            this.currentHotelReviews = this.reviews.filter(r => r.hotel_id === hId);
            this.newReview = { rating: 5, userName: '', userEmail: '', comment: '' };
          } catch (e) {
            alert('रिव्यू सबमिट करने में त्रुटि: ' + e.message);
          } finally {
            this.submittingReview = false;
          }
        }
      };
    }
  </script>
</body>
</html>
