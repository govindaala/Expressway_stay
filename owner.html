<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>पार्टनर पोर्टल | Expressway Stay & Food</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- मल्टी-लैंग्वेज AI OCR इंजन (Hindi + English) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex flex-col justify-between p-3 sm:p-6" x-data="ownerPortal()" x-init="init()" x-cloak>

  <!-- 1. लॉगिन व रजिस्ट्रेशन बॉक्स -->
  <div x-show="!isLoggedIn" class="w-full max-w-md mx-auto my-auto bg-slate-800 border border-slate-700 p-5 sm:p-6 rounded-3xl shadow-2xl space-y-4">
    
    <div class="flex bg-slate-900/90 p-1.5 rounded-2xl border border-slate-700 text-xs font-bold">
      <button @click="mode = 'login'" :class="mode === 'login' ? 'bg-amber-400 text-slate-950 shadow' : 'text-slate-400'" class="w-1/2 py-2.5 rounded-xl transition">
        🔑 लॉगिन करें
      </button>
      <button @click="mode = 'register'" :class="mode === 'register' ? 'bg-amber-400 text-slate-950 shadow' : 'text-slate-400'" class="w-1/2 py-2.5 rounded-xl transition">
        📝 नया रजिस्ट्रेशन
      </button>
    </div>

    <!-- मोड A: लॉगिन फ़ॉर्म -->
    <div x-show="mode === 'login'" class="space-y-3.5 pt-2">
      <div>
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">लॉगिन आईडी (मोबाइल नंबर)</label>
        <input type="text" x-model="loginId" placeholder="उदा. 9829012345" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-xs mt-1 outline-none focus:border-amber-400 font-mono">
      </div>
      <div>
        <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">6-डिजिट मास्टर पिन</label>
        <input type="password" maxlength="6" x-model="loginPin" placeholder="••••••" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-3 text-sm mt-1 outline-none focus:border-amber-400 font-mono tracking-widest text-center text-lg">
      </div>

      <button @click="doLogin()" :disabled="loading" class="w-full bg-amber-400 active:bg-amber-500 text-slate-950 font-extrabold py-3.5 rounded-xl text-xs transition shadow flex items-center justify-center gap-2 mt-2">
        <span x-show="!loading">कंट्रोल डैशबोर्ड खोलें ➔</span>
        <span x-show="loading" class="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
      </button>
    </div>

    <!-- मोड B: नया रजिस्ट्रेशन फ़ॉर्म -->
    <div x-show="mode === 'register'" class="space-y-3 pt-1">
      
      <!-- 1. बिज़नेस सुविधा (3 विकल्प) -->
      <div>
        <label class="text-[11px] font-bold text-slate-400 block mb-1">बिजनेस की सुविधा चुनें *</label>
        <div class="grid grid-cols-3 gap-1.5 text-[11px]">
          <button type="button" @click="reg.category = 'hotel'" :class="reg.category === 'hotel' ? 'bg-indigo-600 text-white border-indigo-500 shadow' : 'bg-slate-900 text-slate-400 border-slate-700'" class="py-2.5 px-1 rounded-xl border font-bold flex flex-col items-center justify-center gap-0.5 transition">
            <span class="text-base">🏨</span>
            <span>केवल होटल</span>
          </button>
          <button type="button" @click="reg.category = 'restaurant'" :class="reg.category === 'restaurant' ? 'bg-orange-600 text-white border-orange-500 shadow' : 'bg-slate-900 text-slate-400 border-slate-700'" class="py-2.5 px-1 rounded-xl border font-bold flex flex-col items-center justify-center gap-0.5 transition">
            <span class="text-base">🍽️</span>
            <span>केवल ढाबा</span>
          </button>
          <button type="button" @click="reg.category = 'both'" :class="reg.category === 'both' ? 'bg-emerald-600 text-white border-emerald-500 shadow' : 'bg-slate-900 text-slate-400 border-slate-700'" class="py-2.5 px-1 rounded-xl border font-bold flex flex-col items-center justify-center gap-0.5 transition">
            <span class="text-base">🏨🍽️</span>
            <span>दोनों सुविधा</span>
          </button>
        </div>
      </div>

      <!-- 2. भोजन प्रकार -->
      <div>
        <label class="text-[11px] font-bold text-slate-400 block mb-1">भोजन प्रकार (Food Type) *</label>
        <div class="grid grid-cols-3 gap-1.5 text-[11px]">
          <button type="button" @click="reg.food_type = 'veg'" :class="reg.food_type === 'veg' ? 'bg-emerald-600 text-white border-emerald-500 shadow' : 'bg-slate-900 text-slate-400 border-slate-700'" class="py-2 px-1 rounded-xl border font-bold flex flex-col items-center justify-center gap-0.5 transition">
            <span>🟢 शाकाहारी</span>
          </button>
          <button type="button" @click="reg.food_type = 'non_veg'" :class="reg.food_type === 'non_veg' ? 'bg-rose-700 text-white border-rose-600 shadow' : 'bg-slate-900 text-slate-400 border-slate-700'" class="py-2 px-1 rounded-xl border font-bold flex flex-col items-center justify-center gap-0.5 transition">
            <span>🔴 नॉन-वेज</span>
          </button>
          <button type="button" @click="reg.food_type = 'both'" :class="reg.food_type === 'both' ? 'bg-amber-600 text-white border-amber-500 shadow' : 'bg-slate-900 text-slate-400 border-slate-700'" class="py-2 px-1 rounded-xl border font-bold flex flex-col items-center justify-center gap-0.5 transition">
            <span>🟡 दोनों</span>
          </button>
        </div>
      </div>

      <div>
        <label class="text-[11px] font-bold text-slate-400">होटल / ढाबे का नाम *</label>
        <input type="text" x-model="reg.name" placeholder="उदा. हाईवे किंग" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs mt-1 outline-none focus:border-amber-400">
      </div>

      <!-- GPS लोकेशन -->
      <div>
        <div class="flex justify-between items-center">
          <label class="text-[11px] font-bold text-slate-400">सटीक GPS लोकेशन *</label>
          <button type="button" @click="detectLocation()" :disabled="detectingGps" class="text-[10px] bg-emerald-600 hover:bg-emerald-700 text-white px-2 py-0.5 rounded font-bold flex items-center gap-1">
            <span x-show="!detectingGps">📍 GPS से भरें</span>
            <span x-show="detectingGps">खोज रहा है... ⏳</span>
          </button>
        </div>
        <input type="text" x-model="reg.city" placeholder="GPS बटन दबाएँ या शहर/कट लिखें" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs mt-1 outline-none focus:border-amber-400">
        <template x-if="reg.lat && reg.lon">
          <span class="text-[10px] text-emerald-400 block mt-0.5" x-text="'✓ GPS पिन सेट: ' + reg.lat.toFixed(4) + ', ' + reg.lon.toFixed(4)"></span>
        </template>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-[11px] font-bold text-slate-400">लॉगिन आईडी (मोबाइल) *</label>
          <input type="text" x-model="reg.loginId" placeholder="मोबाइल नंबर" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs mt-1 font-mono outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="text-[11px] font-bold text-slate-400">6-अंक पिन चुनें *</label>
          <input type="password" maxlength="6" x-model="reg.pin" placeholder="6 अंक" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs mt-1 font-mono tracking-widest text-center outline-none focus:border-amber-400">
        </div>
      </div>

      <div>
        <label class="text-[11px] font-bold text-slate-400">कॉलिंग फ़ोन नंबर *</label>
        <input type="text" x-model="reg.phone" placeholder="यात्री इसी नंबर पर कॉल करेंगे" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs mt-1 outline-none focus:border-amber-400">
      </div>

      <!-- कमरे (यदि होटल या दोनों चुना गया हो) -->
      <template x-if="reg.category === 'hotel' || reg.category === 'both'">
        <div class="space-y-2 pt-1">
          <div class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-700 space-y-1">
            <span class="text-[11px] font-bold text-sky-400">❄️ AC कमरा सेटअप</span>
            <div class="grid grid-cols-2 gap-2">
              <input type="number" x-model="reg.ac_rooms_total" placeholder="AC कमरे (5)" class="w-full bg-slate-800 border border-slate-600 text-white rounded-lg p-2 text-xs font-bold">
              <input type="number" x-model="reg.ac_price" placeholder="किराया ₹ (2000)" class="w-full bg-slate-800 border border-slate-600 text-white rounded-lg p-2 text-xs font-bold">
            </div>
          </div>
          <div class="p-2.5 rounded-xl bg-slate-900/80 border border-slate-700 space-y-1">
            <span class="text-[11px] font-bold text-amber-400">🌀 नॉन-AC कमरा सेटअप</span>
            <div class="grid grid-cols-2 gap-2">
              <input type="number" x-model="reg.non_ac_rooms_total" placeholder="नॉन-AC (10)" class="w-full bg-slate-800 border border-slate-600 text-white rounded-lg p-2 text-xs font-bold">
              <input type="number" x-model="reg.non_ac_price" placeholder="किराया ₹ (1200)" class="w-full bg-slate-800 border border-slate-600 text-white rounded-lg p-2 text-xs font-bold">
            </div>
          </div>
        </div>
      </template>

      <!-- थाली दर (यदि ढाबा या दोनों चुना गया हो) -->
      <template x-if="reg.category === 'restaurant' || reg.category === 'both'">
        <div>
          <label class="text-[11px] font-bold text-slate-400">शुरुआती थाली / भोजन दर (₹) *</label>
          <input type="number" x-model="reg.price" placeholder="उदा. 150" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl p-2.5 text-xs mt-1 outline-none focus:border-amber-400">
        </div>
      </template>

      <button @click="submitRegistration()" :disabled="submitting" class="w-full bg-emerald-500 active:bg-emerald-600 text-slate-950 font-extrabold py-3.5 rounded-xl text-xs transition shadow flex items-center justify-center gap-2 mt-2">
        <span x-show="!submitting">🚀 रजिस्टर करें और तुरंत लाइव हों</span>
        <span x-show="submitting" class="w-4 h-4 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
      </button>
    </div>

  </div>

  <!-- 2. ओनर कंट्रोल डैशबोर्ड -->
  <div x-show="isLoggedIn" class="w-full max-w-lg mx-auto space-y-4 my-auto">
    <div class="bg-slate-800/90 border border-slate-700 p-4 rounded-2xl flex justify-between items-center shadow-md">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full bg-slate-700 text-slate-200" 
                x-text="hotel.category === 'both' ? '🏨🍽️ होटल + ढाबा' : (hotel.category === 'restaurant' ? '🍽️ ढाबा/रेस्टोरेंट' : '🏨 होटल')"></span>
          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-700 text-slate-300"
                x-text="hotel.food_type === 'non_veg' ? '🔴 नॉन-वेज' : (hotel.food_type === 'both' ? '🟡 वेज+नॉनवेज' : '🟢 शाकाहारी')"></span>
        </div>
        <h2 class="text-base font-extrabold text-white mt-1" x-text="hotel.name"></h2>
        <p class="text-xs text-slate-400" x-text="'📍 ' + hotel.city"></p>
      </div>
      <button @click="logout()" class="text-xs bg-slate-700 active:bg-slate-600 text-slate-300 px-3 py-1.5 rounded-xl font-bold border border-slate-600">
        लॉगआउट
      </button>
    </div>

    <!-- कमरा इन्वेंटरी (होटल या दोनों होने पर) -->
    <template x-if="hotel.category === 'hotel' || hotel.category === 'both'">
      <div class="space-y-3">
        <!-- AC कमरा -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-3xl shadow-lg space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-black text-sky-400">❄️ AC कमरे</span>
            <div class="flex items-center gap-1.5">
              <span class="text-2xl font-black font-mono" :class="hotel.ac_rooms_available > 0 ? 'text-emerald-400' : 'text-rose-500'" x-text="hotel.ac_rooms_available"></span>
              <span class="text-xs font-bold text-slate-400" x-text="'/ ' + hotel.ac_rooms_total + ' खाली'"></span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button @click="changeAcRooms(-1)" :disabled="hotel.ac_rooms_available <= 0 || updating" class="bg-slate-700 active:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs">− 1 घटाएँ</button>
            <button @click="changeAcRooms(1)" :disabled="hotel.ac_rooms_available >= hotel.ac_rooms_total || updating" class="bg-sky-600 active:bg-sky-700 text-white font-bold py-2.5 rounded-xl text-xs">+ 1 बढ़ाएँ</button>
          </div>
        </div>

        <!-- नॉन-AC कमरा -->
        <div class="bg-slate-800 border border-slate-700 p-4 rounded-3xl shadow-lg space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-black text-amber-400">🌀 नॉन-AC कमरे</span>
            <div class="flex items-center gap-1.5">
              <span class="text-2xl font-black font-mono" :class="hotel.non_ac_rooms_available > 0 ? 'text-emerald-400' : 'text-rose-500'" x-text="hotel.non_ac_rooms_available"></span>
              <span class="text-xs font-bold text-slate-400" x-text="'/ ' + hotel.non_ac_rooms_total + ' खाली'"></span>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <button @click="changeNonAcRooms(-1)" :disabled="hotel.non_ac_rooms_available <= 0 || updating" class="bg-slate-700 active:bg-slate-600 text-white font-bold py-2.5 rounded-xl text-xs">− 1 घटाएँ</button>
            <button @click="changeNonAcRooms(1)" :disabled="hotel.non_ac_rooms_available >= hotel.non_ac_rooms_total || updating" class="bg-amber-500 active:bg-amber-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs">+ 1 बढ़ाएँ</button>
          </div>
        </div>
      </div>
    </template>

    <!-- 🍽️ मल्टी-पेज AI मेन्यू व कैटेगरी हब (ढाबा या दोनों होने पर) -->
    <template x-if="hotel.category === 'restaurant' || hotel.category === 'both'">
      <div class="bg-slate-800 border border-slate-700 p-5 rounded-3xl shadow-xl space-y-4">
        
        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
          <div>
            <h3 class="text-sm font-black text-white flex items-center gap-1.5">📋 मेन्यू व डिश मैनेजमेंट</h3>
            <p class="text-[10px] text-slate-400">मल्टी-पेज (2-4 पेज) व द्विभाषी कार्ड सपोर्ट</p>
          </div>
          
          <label class="cursor-pointer bg-gradient-to-r from-indigo-600 to-purple-600 active:scale-95 text-white font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow transition">
            <span>📸 कार्ड स्कैन (2-4 पेज)</span>
            <input type="file" accept="image/*" multiple class="hidden" @change="scanMultiPageMenu($event)">
          </label>
        </div>

        <!-- AI स्कैनिंग प्रोग्रेस -->
        <div x-show="ocrProcessing" class="p-3 bg-indigo-950/90 border border-indigo-500 rounded-2xl text-center space-y-1 shadow-inner">
          <div class="text-xs font-black text-indigo-200" x-text="scanStatusText"></div>
          <p class="text-[10px] text-slate-400">कृपया प्रतीक्षा करें, AI फ़ोटो से व्यंजन और दरें पढ़ रहा है...</p>
        </div>

        <!-- स्कैन के बाद प्रीव्यू व 1-क्लिक बल्क सेव -->
        <div x-show="scannedBatch.length > 0" class="p-3 bg-slate-900 border border-amber-500/60 rounded-2xl space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-black text-amber-400">✨ AI द्वारा निकाले गए व्यंजन (<span x-text="scannedBatch.length"></span>)</span>
            <button @click="saveScannedBatch()" :disabled="menuLoading" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black px-3 py-1.5 rounded-lg text-xs shadow flex items-center gap-1">
              <span x-show="!menuLoading">✓ सभी मेन्यू में सेव करें</span>
              <span x-show="menuLoading">सेव हो रहा है...</span>
            </button>
          </div>

          <div class="max-h-52 overflow-y-auto space-y-2 pr-1">
            <template x-for="(item, idx) in scannedBatch" :key="idx">
              <div class="grid grid-cols-12 gap-1.5 items-center bg-slate-800 p-2 rounded-xl text-xs">
                <!-- कैटेगरी सेलेक्टर -->
                <select x-model="item.category" class="col-span-4 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-[10px] text-amber-300 font-bold outline-none">
                  <option value="मेन कोर्स (सब्जी)">🍲 मेन कोर्स (सब्जी)</option>
                  <option value="तंदूरी ब्रेड्स / रोटियां">🍞 रोटी / नान</option>
                  <option value="दाल व चावल">🍚 दाल व चावल</option>
                  <option value="स्पेशल थाली">🍱 स्पेशल थाली</option>
                  <option value="ब्रेकफास्ट / नाश्ता">☕ नाश्ता / स्नैक्स</option>
                  <option value="चाय व पेय">🥤 चाय व पेय</option>
                  <option value="अन्य">🥗 रायता / अन्य</option>
                </select>

                <!-- डिश नाम -->
                <input type="text" x-model="item.name" class="col-span-5 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-white outline-none">

                <!-- कीमत -->
                <input type="number" x-model="item.price" class="col-span-2 bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs text-emerald-400 font-mono font-bold text-center outline-none">

                <!-- डिलीट -->
                <button @click="scannedBatch.splice(idx, 1)" class="col-span-1 text-rose-400 hover:text-rose-300 text-sm font-bold text-center">✕</button>
              </div>
            </template>
          </div>
        </div>

        <!-- 1-क्लिक मैनुअल डिश जोड़ना -->
        <div class="grid grid-cols-12 gap-1.5 bg-slate-900 p-2 rounded-2xl border border-slate-700">
          <select x-model="newMenuItem.category" class="col-span-4 bg-slate-800 border border-slate-600 rounded-xl p-1.5 text-[11px] text-amber-300 font-bold outline-none">
            <option value="मेन कोर्स (सब्जी)">🍲 मेन कोर्स</option>
            <option value="तंदूरी ब्रेड्स / रोटियां">🍞 रोटी / नान</option>
            <option value="दाल व चावल">🍚 दाल व चावल</option>
            <option value="स्पेशल थाली">🍱 थाली</option>
            <option value="ब्रेकफास्ट / नाश्ता">☕ नाश्ता</option>
            <option value="चाय व पेय">🥤 चाय / पेय</option>
            <option value="अन्य">🥗 अन्य</option>
          </select>
          <input type="text" x-model="newMenuItem.name" placeholder="डिश नाम" class="col-span-4 bg-slate-800 border border-slate-600 rounded-xl p-1.5 text-xs text-white outline-none">
          <input type="number" x-model="newMenuItem.price" placeholder="₹" class="col-span-2 bg-slate-800 border border-slate-600 rounded-xl p-1.5 text-xs text-white text-center font-bold outline-none">
          <button @click="addManualMenuItem()" :disabled="menuLoading" class="col-span-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black rounded-xl text-xs">+ जोड़ें</button>
        </div>

        <!-- लाइव सेव्ड मेन्यू लिस्ट -->
        <div class="space-y-3 max-h-60 overflow-y-auto pr-1">
          <template x-for="cat in uniqueCategories" :key="cat">
            <div class="space-y-1.5">
              <span class="text-[11px] font-black text-amber-400 uppercase tracking-wider block bg-slate-900/60 px-2.5 py-1 rounded-lg border border-slate-700/60" x-text="cat"></span>
              <template x-for="dish in menuList.filter(m => (m.category || 'मेन कोर्स (सब्जी)') === cat)" :key="dish.id">
                <div class="bg-slate-900/90 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between text-xs">
                  <div>
                    <span class="font-bold text-slate-200" x-text="dish.item_name"></span>
                    <span class="text-emerald-400 font-mono font-bold ml-1.5" x-text="'₹' + dish.price"></span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button @click="toggleMenuAvailability(dish)" class="text-[10px] px-2 py-0.5 rounded font-bold" :class="Number(dish.is_available) === 1 ? 'bg-emerald-950 text-emerald-300 border border-emerald-800' : 'bg-rose-950 text-rose-300 border border-rose-800'" x-text="Number(dish.is_available) === 1 ? 'उपलब्ध' : 'बंद'"></button>
                    <button @click="deleteMenuItem(dish.id)" class="text-rose-400 hover:text-rose-300 text-sm font-bold">✕</button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <div x-show="menuList.length === 0 && scannedBatch.length === 0" class="text-center py-5 text-xs text-slate-500">
            मेन्यू खाली है। ऊपर 2-4 पन्नों की फ़ोटो अपलोड करके ऑटो-स्कैन करें।
          </div>
        </div>

      </div>
    </template>

    <div class="text-center pt-2">
      <a :href="'https://govindaala.github.io/Expressway_stay/Index.html'" target="_blank" class="text-xs text-indigo-400 hover:underline inline-flex items-center gap-1 font-semibold">
        👁️ लाइव यात्री स्क्रीन देखें ➔
      </a>
    </div>
  </div>

  <footer class="text-center text-[11px] text-slate-600 py-2">
    Expressway Stay & Food • पार्टनर नेटवर्क
  </footer>

  <script>
    const TURSO_PIPELINE_URL = "https://expresswaystay-govindaala.aws-ap-south-1.turso.io/v2/pipeline";
    const TURSO_AUTH_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODg5OTE1MzIsImlkIjoiMDFhMDg4MzItM2UwMS03NGY5LTk3NTQtYTg4YjBkZTAyMTA1Iiwia2lkIjoiV0JkNlJ2dHFndUYtOHV1R2tnT0xSWWREU0lCaGVOem8xVy1QNXhBWkNVVSIsInJpZCI6ImE5OWVlZTcxLTNkZGItNDMzMi1hZDU5LTQzZmU4NWIwNjBhNiJ9.2igLL_0RTRvj6QJIq7enEUqoKFkx-v0OOpcL4Gc6dFzdYp3nDfaKyp740YD4B1e5cPnpIbHAy4ihec0vEdgcBg";

    function ownerPortal() {
      return {
        mode: 'login',
        loginId: '',
        loginPin: '',
        isLoggedIn: false,
        loading: false,
        updating: false,
        detectingGps: false,
        submitting: false,
        ocrProcessing: false,
        scanStatusText: '',
        menuLoading: false,
        menuList: [],
        scannedBatch: [],
        newMenuItem: { category: 'मेन कोर्स (सब्जी)', name: '', price: '' },
        reg: {
          category: 'both', food_type: 'veg', name: '', city: '', loginId: '', pin: '', phone: '', price: 150,
          ac_rooms_total: 5, ac_price: 2000, non_ac_rooms_total: 10, non_ac_price: 1200,
          lat: null, lon: null
        },
        hotel: {
          login_id: '', category: 'both', food_type: 'veg', name: '', city: '',
          ac_rooms_total: 0, ac_rooms_available: 0, ac_price: 0,
          non_ac_rooms_total: 0, non_ac_rooms_available: 0, non_ac_price: 0
        },

        async init() {
          // मेन्यू टेबल का स्वतः निर्माण (यदि न बनी हो)
          try {
            await this.executeTurso(`CREATE TABLE IF NOT EXISTS menu_items (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              hotel_id TEXT NOT NULL,
              item_name TEXT NOT NULL,
              category TEXT DEFAULT 'मेन कोर्स (सब्जी)',
              price REAL NOT NULL,
              is_available INTEGER DEFAULT 1
            )`);
          } catch (e) {}

          const saved = localStorage.getItem('stay_owner_hotel');
          if (saved) {
            try {
              this.hotel = JSON.parse(saved);
              this.isLoggedIn = true;
              this.refreshData();
              this.fetchMenu();
            } catch (e) {
              localStorage.removeItem('stay_owner_hotel');
            }
          }
        },

        get uniqueCategories() {
          const cats = this.menuList.map(m => m.category || 'मेन कोर्स (सब्जी)');
          return [...new Set(cats)];
        },

        detectLocation() {
          if (!navigator.geolocation) return alert('GPS उपलब्ध नहीं है!');
          this.detectingGps = true;
          navigator.geolocation.getCurrentPosition(
            async (pos) => {
              this.reg.lat = pos.coords.latitude;
              this.reg.lon = pos.coords.longitude;
              try {
                const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${this.reg.lat}&longitude=${this.reg.lon}&localityLanguage=en`);
                const data = await res.json();
                const locality = data.locality || data.city || '';
                const district = data.localityInfo?.administrative?.[2]?.name || data.principalSubdivision || '';
                this.reg.city = (locality && district && locality !== district) ? `${locality}, ${district}` : (locality || district || `${this.reg.lat.toFixed(4)}, ${this.reg.lon.toFixed(4)}`);
              } catch (e) {
                this.reg.city = `${this.reg.lat.toFixed(4)}, ${this.reg.lon.toFixed(4)}`;
              } finally {
                this.detectingGps = false;
              }
            },
            () => { this.detectingGps = false; alert('GPS सिग्नल नहीं मिला! कृपया लोकेशन परमिशन चालू करें।'); },
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
          );
        },

        async executeTurso(sqlQuery) {
          const res = await fetch(TURSO_PIPELINE_URL, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${TURSO_AUTH_TOKEN.trim()}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              requests: [
                { type: "execute", stmt: { sql: sqlQuery } },
                { type: "close" }
              ]
            })
          });
          const data = await res.json();
          if (data.results && data.results[0]?.type === "error") throw new Error(data.results[0].error.message);
          if (data.results && data.results[0]?.response?.result) {
            const execRes = data.results[0].response.result;
            const cols = (execRes.cols || []).map(c => c.name);
            return (execRes.rows || []).map(row => {
              const obj = {};
              row.forEach((cell, idx) => { obj[cols[idx]] = cell.value; });
              return obj;
            });
          }
          return [];
        },

        async submitRegistration() {
          if (!this.reg.name || !this.reg.city || !this.reg.loginId || !this.reg.pin || !this.reg.phone) {
            return alert('कृपया सभी जरूरी बॉक्स भरें!');
          }
          if (this.reg.pin.length !== 6) return alert('पिन ठीक 6 अंकों का रखें!');
          this.submitting = true;

          const cat = (this.reg.category || 'both').toLowerCase();
          const fType = (this.reg.food_type || 'veg').toLowerCase();
          const acTot = (cat === 'restaurant') ? 0 : (Number(this.reg.ac_rooms_total) || 0);
          const acPr = (cat === 'restaurant') ? 0 : (Number(this.reg.ac_price) || 0);
          const nonAcTot = (cat === 'restaurant') ? 0 : (Number(this.reg.non_ac_rooms_total) || 0);
          const nonAcPr = (cat === 'restaurant') ? 0 : (Number(this.reg.non_ac_price) || 0);
          const totRooms = acTot + nonAcTot;
          const startPrice = (cat === 'restaurant') ? (Number(this.reg.price) || 150) : (Math.min(acPr || 9999, nonAcPr || 9999));
          const latVal = this.reg.lat !== null ? this.reg.lat : 'NULL';
          const lonVal = this.reg.lon !== null ? this.reg.lon : 'NULL';

          const cleanId = this.reg.loginId.trim().replace(/'/g, "''");
          const cleanPin = this.reg.pin.trim().replace(/'/g, "''");
          const cleanName = this.reg.name.trim().replace(/'/g, "''");
          const cleanCity = this.reg.city.trim().replace(/'/g, "''");
          const cleanPhone = this.reg.phone.trim().replace(/'/g, "''");

          const sql = `INSERT INTO hotels (login_id, pin, name, city, phone, total_rooms, available_rooms, starting_price, is_active, category, food_type, lat, lon, ac_rooms_total, ac_rooms_available, ac_price, non_ac_rooms_total, non_ac_rooms_available, non_ac_price)
                       VALUES ('${cleanId}', '${cleanPin}', '${cleanName}', '${cleanCity}', '${cleanPhone}', ${totRooms}, ${totRooms}, ${startPrice}, 1, '${cat}', '${fType}', ${latVal}, ${lonVal}, ${acTot}, ${acTot}, ${acPr}, ${nonAcTot}, ${nonAcTot}, ${nonAcPr})`;

          try {
            await this.executeTurso(sql);
            alert('🎉 पार्टनर रजिस्ट्रेशन सफल और तुरंत लाइव है!');
            this.mode = 'login';
            this.loginId = this.reg.loginId;
            this.loginPin = this.reg.pin;
          } catch (e) {
            alert('रजिस्ट्रेशन एरर: ' + e.message);
          } finally {
            this.submitting = false;
          }
        },

        async doLogin() {
          if (!this.loginId || !this.loginPin) return alert('कृपया आईडी और पिन डालें!');
          this.loading = true;
          const cleanId = this.loginId.trim().replace(/'/g, "''");
          const cleanPin = this.loginPin.trim().replace(/'/g, "''");

          try {
            const rows = await this.executeTurso(`SELECT * FROM hotels WHERE login_id = '${cleanId}' AND pin = '${cleanPin}' LIMIT 1`);
            if (rows && rows.length > 0) {
              const h = rows[0];
              if (Number(h.is_active) === 0) return alert('⚠️ आपका खाता ब्लॉक है!');
              this.hotel = this.formatHotel(h);
              this.isLoggedIn = true;
              localStorage.setItem('stay_owner_hotel', JSON.stringify(this.hotel));
              await this.fetchMenu();
            } else {
              alert('गलत आईडी या पिन!');
            }
          } catch (e) {
            alert('लॉगिन एरर: ' + e.message);
          } finally {
            this.loading = false;
          }
        },

        formatHotel(h) {
          return {
            ...h,
            ac_rooms_total: Number(h.ac_rooms_total) || 0,
            ac_rooms_available: Number(h.ac_rooms_available) || 0,
            ac_price: Number(h.ac_price) || 0,
            non_ac_rooms_total: Number(h.non_ac_rooms_total) || 0,
            non_ac_rooms_available: Number(h.non_ac_rooms_available) || 0,
            non_ac_price: Number(h.non_ac_price) || 0,
            category: (h.category || 'both').toLowerCase(),
            food_type: (h.food_type || 'veg').toLowerCase()
          };
        },

        async refreshData() {
          try {
            const rows = await this.executeTurso(`SELECT * FROM hotels WHERE login_id = '${this.hotel.login_id}' LIMIT 1`);
            if (rows && rows.length > 0) {
              this.hotel = this.formatHotel(rows[0]);
              localStorage.setItem('stay_owner_hotel', JSON.stringify(this.hotel));
            }
          } catch (e) {}
        },

        async changeAcRooms(delta) {
          const next = this.hotel.ac_rooms_available + delta;
          if (next < 0 || next > this.hotel.ac_rooms_total) return;
          this.hotel.ac_rooms_available = next;
          this.updating = true;
          try {
            await this.executeTurso(`UPDATE hotels SET ac_rooms_available = ${next}, available_rooms = ${next + this.hotel.non_ac_rooms_available} WHERE login_id = '${this.hotel.login_id}'`);
            localStorage.setItem('stay_owner_hotel', JSON.stringify(this.hotel));
          } finally { this.updating = false; }
        },

        async changeNonAcRooms(delta) {
          const next = this.hotel.non_ac_rooms_available + delta;
          if (next < 0 || next > this.hotel.non_ac_rooms_total) return;
          this.hotel.non_ac_rooms_available = next;
          this.updating = true;
          try {
            await this.executeTurso(`UPDATE hotels SET non_ac_rooms_available = ${next}, available_rooms = ${this.hotel.ac_rooms_available + next} WHERE login_id = '${this.hotel.login_id}'`);
            localStorage.setItem('stay_owner_hotel', JSON.stringify(this.hotel));
          } finally { this.updating = false; }
        },

        async fetchMenu() {
          try {
            this.menuList = await this.executeTurso(`SELECT * FROM menu_items WHERE hotel_id = '${this.hotel.login_id}' ORDER BY id DESC`);
          } catch (e) {}
        },

        async addManualMenuItem() {
          if (!this.newMenuItem.name || !this.newMenuItem.price) return alert('डिश और कीमत दोनों लिखें!');
          this.menuLoading = true;
          const cleanName = this.newMenuItem.name.trim().replace(/'/g, "''");
          const cleanCat = (this.newMenuItem.category || 'मेन कोर्स (सब्जी)').trim().replace(/'/g, "''");
          const pr = Number(this.newMenuItem.price) || 0;
          try {
            await this.executeTurso(`INSERT INTO menu_items (hotel_id, item_name, category, price) VALUES ('${this.hotel.login_id}', '${cleanName}', '${cleanCat}', ${pr})`);
            this.newMenuItem.name = '';
            this.newMenuItem.price = '';
            await this.fetchMenu();
          } finally {
            this.menuLoading = false;
          }
        },

        async toggleMenuAvailability(item) {
          const next = Number(item.is_available) === 1 ? 0 : 1;
          await this.executeTurso(`UPDATE menu_items SET is_available = ${next} WHERE id = ${item.id}`);
          await this.fetchMenu();
        },

        async deleteMenuItem(id) {
          await this.executeTurso(`DELETE FROM menu_items WHERE id = ${id}`);
          await this.fetchMenu();
        },

        // --- मल्टी-पेज AI OCR इंजन (Hindi + English) ---
        async scanMultiPageMenu(event) {
          const files = Array.from(event.target.files);
          if (!files || files.length === 0) return;

          this.ocrProcessing = true;
          this.scannedBatch = [];
          let currentCategory = 'मेन कोर्स (सब्जी)';

          try {
            const worker = await Tesseract.createWorker('hin+eng', 1, {
              logger: m => {
                if (m.status === 'recognizing text') {
                  this.scanStatusText = `टेक्स्ट पढ़ा जा रहा है: ${Math.round(m.progress * 100)}%`;
                }
              }
            });

            for (let i = 0; i < files.length; i++) {
              this.scanStatusText = `पेज ${i + 1} / ${files.length} प्रोसेस हो रहा है...`;
              const ret = await worker.recognize(files[i]);
              const lines = ret.data.text.split('\n');

              for (let rawLine of lines) {
                const line = rawLine.trim();
                if (line.length < 2) continue;

                // 1. ऑटो-कैटेगरी पहचान
                const lower = line.toLowerCase();
                if (lower.includes('roti') || lower.includes('bread') || lower.includes('नान') || lower.includes('रोटी') || lower.includes('तन्दूरी')) {
                  currentCategory = 'तंदूरी ब्रेड्स / रोटियां';
                  continue;
                } else if (lower.includes('rice') || lower.includes('biryani') || lower.includes('pulao') || lower.includes('चावल') || lower.includes('पुलाव')) {
                  currentCategory = 'दाल व चावल';
                  continue;
                } else if (lower.includes('thali') || lower.includes('थाली')) {
                  currentCategory = 'स्पेशल थाली';
                  continue;
                } else if (lower.includes('breakfast') || lower.includes('snacks') || lower.includes('नाश्ता') || lower.includes('पकोड़ा') || lower.includes('पराठा')) {
                  currentCategory = 'ब्रेकफास्ट / नाश्ता';
                  continue;
                } else if (lower.includes('tea') || lower.includes('coffee') || lower.includes('beverage') || lower.includes('चाय') || lower.includes('कॉफी') || lower.includes('दूध') || lower.includes('लस्सी')) {
                  currentCategory = 'चाय व पेय';
                  continue;
                } else if (lower.includes('salad') || lower.includes('raita') || lower.includes('papad') || lower.includes('सलाद') || lower.includes('रायता') || lower.includes('पापड़')) {
                  currentCategory = 'अन्य';
                  continue;
                } else if (lower.includes('main') || lower.includes('sabji') || lower.includes('paneer') || lower.includes('सब्जी') || lower.includes('पनीर')) {
                  currentCategory = 'मेन कोर्स (सब्जी)';
                  continue;
                }

                // 2. डिश व रेट एक्सट्रैक्शन (उदा. Dal Fry 120/-, ₹140, Paneer - 180)
                const match = line.match(/^(.+?)\s*[:\-–./₹]?\s*(?:rs\.?|inr|₹)?\s*(\d{2,4})(?:\/|\.00|\/-)?\s*$/i);
                if (match && match[1].trim().length >= 2) {
                  const dishName = match[1].replace(/^[0-9.\-–*#\s]+/, '').trim();
                  const dishPrice = Number(match[2]);
                  if (dishName.length >= 2 && dishPrice > 5) {
                    this.scannedBatch.push({
                      category: currentCategory,
                      name: dishName,
                      price: dishPrice
                    });
                  }
                }
              }
            }
            await worker.terminate();

            if (this.scannedBatch.length === 0) {
              alert('फ़ोटो से कोई डिश नहीं मिली। कृपया साफ़ रोशनी में दोबारा फ़ोटो लें या नाम सीधे टाइप करें।');
            }
          } catch (err) {
            alert('स्कैनिंग त्रुटि: ' + err.message);
          } finally {
            this.ocrProcessing = false;
            event.target.value = '';
          }
        },

        // --- 1-क्लिक बल्क इंसर्ट (फास्ट और सुरक्षित) ---
        async saveScannedBatch() {
          if (this.scannedBatch.length === 0) return;
          this.menuLoading = true;

          const valuesList = this.scannedBatch.map(item => {
            const cleanName = item.name.trim().replace(/'/g, "''");
            const cleanCat = item.category.trim().replace(/'/g, "''");
            return `('${this.hotel.login_id}', '${cleanName}', '${cleanCat}', ${Number(item.price) || 0})`;
          }).join(', ');

          const bulkSql = `INSERT INTO menu_items (hotel_id, item_name, category, price) VALUES ${valuesList}`;

          try {
            await this.executeTurso(bulkSql);
            alert(`✅ सभी ${this.scannedBatch.length} व्यंजन 1 सेकंड में सफलतापूर्वक सेव हो गए!`);
            this.scannedBatch = [];
            await this.fetchMenu();
          } catch (e) {
            alert('बल्क सेविंग एरर: ' + e.message);
          } finally {
            this.menuLoading = false;
          }
        },

        logout() {
          localStorage.removeItem('stay_owner_hotel');
          this.isLoggedIn = false;
          this.loginId = '';
          this.loginPin = '';
        }
      };
    }
  </script>
