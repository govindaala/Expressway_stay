
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Expressway Stay & Food | Live GPS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    [x-cloak] { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 pb-24" x-data="travellerPortal()" x-init="initPortal()" x-cloak>

  <!-- 1. हेडर -->
  <header class="bg-slate-950 text-white px-4 py-3 flex items-center justify-between text-xs sticky top-0 z-40 border-b border-slate-800 shadow-md">
    <div class="flex items-center gap-2 font-black tracking-wide">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>EXPRESSWAY STAY & FOOD</span>
    </div>
    <button @click="refreshAll()" class="text-[11px] bg-slate-800 active:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 font-bold flex items-center gap-1">
      <span>🔄</span> रीफ़्रेश
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-3.5">
    
    <!-- 2. ऑटो GPS स्टेटस बार -->
    <div class="p-3 rounded-2xl text-xs flex items-center justify-between shadow-sm border transition"
         :class="userLat ? 'bg-emerald-50 border-emerald-200 text-emerald-900' : 'bg-amber-50 border-amber-200 text-amber-900'">
      <div class="flex items-center gap-2">
        <span class="text-lg" x-text="userLat ? '📍' : '⏳'"></span>
        <div>
          <span class="font-extrabold block" x-text="userLat ? 'लाइव GPS लोकेशन सक्रिय है' : 'GPS लोकेशन खोजी जा रही है...'"></span>
          <span class="text-[10px] text-slate-500" x-text="userLat ? 'सबसे नज़दीकी होटल और ढाबे सबसे ऊपर हैं' : 'नज़दीकी होटल देखने के लिए लोकेशन Allow करें'"></span>
        </div>
      </div>
      <button x-show="!userLat" @click="getUserGps()" class="bg-amber-500 active:bg-amber-600 text-slate-950 font-black px-3 py-1.5 rounded-xl text-[10px] shadow">
        GPS ऑन करें
      </button>
    </div>

    <!-- 3. कैटेगरी टैब्स -->
    <div class="grid grid-cols-2 gap-2 bg-slate-200/80 p-1 rounded-2xl">
      <button @click="activeCategory = 'hotel'" :class="activeCategory === 'hotel' ? 'bg-indigo-600 text-white shadow' : 'text-slate-700'" class="py-2.5 rounded-xl font-black text-xs transition flex items-center justify-center gap-1.5">
        <span>🏨</span> होटल (कमरे / Stay)
      </button>
      <button @click="activeCategory = 'restaurant'" :class="activeCategory === 'restaurant' ? 'bg-orange-600 text-white shadow' : 'text-slate-700'" class="py-2.5 rounded-xl font-black text-xs transition flex items-center justify-center gap-1.5">
        <span>🍽️</span> ढाबा / रेस्टोरेंट (खाना)
      </button>
    </div>

    <!-- 4. लाइव सर्च बार -->
    <div class="relative">
      <input type="text" x-model="searchQuery" placeholder="होटल, ढाबा या शहर खोजें..." class="w-full bg-white border border-slate-300 rounded-2xl py-3 pl-10 pr-4 text-xs font-semibold placeholder:text-slate-400 outline-none focus:border-indigo-600 shadow-sm">
      <span class="absolute left-3.5 top-3 text-slate-400 text-sm">🔍</span>
      <button x-show="searchQuery" @click="searchQuery = ''" class="absolute right-3 top-2.5 text-xs text-slate-400 bg-slate-100 rounded-full w-5 h-5 flex items-center justify-center">✕</button>
    </div>

    <!-- लोडिंग इंडिकेटर -->
    <div x-show="loading" class="text-center py-10">
      <div class="inline-block w-7 h-7 border-4 border-slate-300 border-t-indigo-600 rounded-full animate-spin"></div>
      <p class="text-xs text-slate-500 mt-2 font-medium">लाइव डेटा लोड हो रहा है...</p>
    </div>

    <!-- 5. होटल / रेस्टोरेंट कार्ड्स -->
    <div x-show="!loading" class="space-y-3">
      <template x-for="item in sortedAndFilteredList" :key="item.login_id">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 space-y-3">
          
          <!-- शीर्षक, भोजन बैज और दूरी -->
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-base" x-text="item.category === 'both' ? '🏨🍽️' : (item.category === 'restaurant' ? '🍽️' : '🏨')"></span>
                <h3 class="font-black text-slate-900 text-sm" x-text="item.name"></h3>
              </div>

              <!-- वेज / नॉन-वेज बैज -->
              <div class="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-full mt-1"
                   :class="{
                     'bg-emerald-100 text-emerald-800 border border-emerald-300': (item.food_type === 'veg' || !item.food_type),
                     'bg-rose-100 text-rose-800 border border-rose-300': item.food_type === 'non_veg',
                     'bg-amber-100 text-amber-900 border border-amber-300': item.food_type === 'both'
                   }">
                <span x-text="item.food_type === 'non_veg' ? '🔴 नॉन-वेज' : (item.food_type === 'both' ? '🟡 वेज + नॉन-वेज' : '🟢 100% शाकाहारी')"></span>
              </div>

              <p class="text-xs text-slate-500 font-medium mt-1 flex items-center gap-1">
                <span x-text="'📍 ' + item.city"></span>
                <template x-if="item.distanceKm !== null">
                  <span class="bg-indigo-50 text-indigo-700 font-black px-2 py-0.5 rounded-md text-[10px] ml-1" x-text="item.distanceKm + ' km दूर'"></span>
                </template>
              </p>
            </div>

            <div class="text-right whitespace-nowrap">
              <span class="text-[10px] text-slate-400 block font-bold" x-text="item.category === 'restaurant' ? 'शुरुआती थाली' : 'कमरा किराया'"></span>
              <span class="text-sm font-black text-emerald-600" x-text="'₹' + (item.starting_price || 150)"></span>
            </div>
          </div>

          <!-- रेटिंग व रिव्यू बार -->
          <div class="flex items-center justify-between bg-slate-50 border border-slate-100 p-2 rounded-xl text-xs">
            <div class="flex items-center gap-1">
              <span class="text-amber-500 font-black">★</span>
              <span class="font-extrabold text-slate-800" x-text="item.avgRating ? item.avgRating.toFixed(1) : 'नया'"></span>
              <span class="text-slate-400 text-[10px]" x-text="'(' + (item.reviewCount || 0) + ' रिव्यू)'"></span>
            </div>
            <button @click="openReviewModal(item)" class="text-indigo-600 hover:text-indigo-800 font-bold text-[11px] underline">
              रिव्यू दें / पढ़ें ➔
            </button>
          </div>

          <!-- होटल के लिए: AC व नॉन-AC कमरों का विवरण -->
          <template x-if="item.category === 'hotel' || item.category === 'both'">
            <div class="grid grid-cols-2 gap-2 pt-0.5">
              <div class="p-2.5 rounded-xl border" :class="Number(item.ac_rooms_available) > 0 ? 'bg-sky-50/70 border-sky-200' : 'bg-slate-50 border-slate-200'">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-black text-sky-950 flex items-center gap-1">❄️ AC कमरा</span>
                  <span class="text-xs font-black text-sky-700" x-text="'₹' + (item.ac_price || 0)"></span>
                </div>
                <div class="mt-1 flex items-center justify-between text-[10px] font-bold">
                  <span :class="Number(item.ac_rooms_available) > 0 ? 'text-emerald-700' : 'text-rose-600'" x-text="Number(item.ac_rooms_available) > 0 ? 'उपलब्ध' : 'फुल'"></span>
                  <span class="font-mono text-slate-500" x-text="item.ac_rooms_available + ' / ' + item.ac_rooms_total"></span>
                </div>
              </div>

              <div class="p-2.5 rounded-xl border" :class="Number(item.non_ac_rooms_available) > 0 ? 'bg-amber-50/70 border-amber-200' : 'bg-slate-50 border-slate-200'">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-black text-amber-950 flex items-center gap-1">🌀 नॉन-AC</span>
                  <span class="text-xs font-black text-amber-800" x-text="'₹' + (item.non_ac_price || 0)"></span>
                </div>
                <div class="mt-1 flex items-center justify-between text-[10px] font-bold">
                  <span :class="Number(item.non_ac_rooms_available) > 0 ? 'text-emerald-700' : 'text-rose-600'" x-text="Number(item.non_ac_rooms_available) > 0 ? 'उपलब्ध' : 'फुल'"></span>
                  <span class="font-mono text-slate-500" x-text="item.non_ac_rooms_available + ' / ' + item.non_ac_rooms_total"></span>
                </div>
              </div>
            </div>
          </template>

          <!-- ढाबा / रेस्टोरेंट के लिए: मेन्यू बटन -->
          <template x-if="item.category === 'restaurant' || item.category === 'both'">
            <button @click="openMenuModal(item)" class="w-full bg-amber-50 hover:bg-amber-100 active:bg-amber-200 text-amber-950 border border-amber-300 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow-sm transition">
              <span>📋</span> भोजन मेन्यू व लाइव रेट लिस्ट देखें ➔
            </button>
          </template>

          <!-- कॉल और सटीक GPS मैप नेविगेशन -->
          <div class="grid grid-cols-2 gap-2 pt-1">
            <a :href="'tel:' + item.phone" class="bg-slate-900 active:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow">
              <span>📞</span> कॉल करें
            </a>
            <a :href="item.lat && item.lon ? ('https://www.google.com/maps/search/?api=1&query=' + item.lat + ',' + item.lon) : ('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.name + ' ' + item.city))" target="_blank" class="bg-indigo-50 active:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5 shadow-sm">
              <span>🧭</span> मैप नेविगेशन
            </a>
          </div>

        </div>
      </template>

      <!-- शून्य परिणाम -->
      <div x-show="sortedAndFilteredList.length === 0" class="text-center py-12 bg-white rounded-2xl border border-slate-200 p-6">
        <span class="text-3xl block mb-2">🔍</span>
        <h4 class="font-bold text-sm text-slate-800">कोई रिकॉर्ड नहीं मिला</h4>
        <p class="text-xs text-slate-400 mt-1">कृपया सर्च कीवर्ड बदलें या अन्य टैब चुनें।</p>
      </div>
    </div>
  </main>

  <!-- 6. डिजिटल मेन्यू पॉपअप मोडल (कैटेगरी टैब्स सहित) -->
  <div x-show="activeHotelForMenu" class="fixed inset-0 bg-slate-900/75 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[85vh] overflow-y-auto space-y-4 shadow-2xl">
      
      <div class="flex justify-between items-start border-b pb-2">
        <div>
          <span class="text-[10px] uppercase font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-full">डिजिटल मेन्यू कार्ड</span>
          <h3 class="text-base font-black text-slate-900 mt-1" x-text="activeHotelForMenu?.name"></h3>
        </div>
        <button @click="activeHotelForMenu = null" class="text-slate-400 hover:text-slate-700 text-lg font-bold bg-slate-100 rounded-full w-7 h-7 flex items-center justify-center">✕</button>
      </div>

      <!-- हॉरिज़ॉन्टल स्क्रॉलिंग कैटेगरी टैब्स -->
      <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs no-scrollbar">
        <button @click="selectedMenuCategory = 'all'" 
                :class="selectedMenuCategory === 'all' ? 'bg-slate-950 text-white shadow' : 'bg-slate-100 text-slate-700'" 
                class="px-3 py-1.5 rounded-xl font-bold whitespace-nowrap transition">
          सभी व्यंजन
        </button>
        <template x-for="cat in hotelMenuCategories" :key="cat">
          <button @click="selectedMenuCategory = cat" 
                  :class="selectedMenuCategory === cat ? 'bg-amber-500 text-slate-950 shadow font-black' : 'bg-slate-100 text-slate-700 font-bold'" 
                  class="px-3 py-1.5 rounded-xl whitespace-nowrap transition" 
                  x-text="cat"></button>
        </template>
      </div>

      <!-- मेन्यू आइटम्स सूची -->
      <div class="space-y-2 max-h-96 overflow-y-auto pr-1">
        <template x-for="dish in filteredHotelMenu" :key="dish.id">
          <div class="p-2.5 rounded-xl border border-slate-200 flex justify-between items-center text-xs hover:bg-slate-50 transition">
            <div>
              <span class="font-bold text-slate-900" x-text="dish.item_name"></span>
              <span class="text-[10px] block text-slate-400" x-text="dish.category || 'मेन कोर्स (सब्जी)'"></span>
            </div>
            <div class="text-right">
              <span class="font-black text-emerald-700 font-mono text-sm" x-text="'₹' + dish.price"></span>
              <span class="text-[9px] block font-bold" :class="Number(dish.is_available) === 1 ? 'text-emerald-600' : 'text-rose-500'" x-text="Number(dish.is_available) === 1 ? '✓ उपलब्ध' : '✕ समाप्त'"></span>
            </div>
          </div>
        </template>
        <div x-show="filteredHotelMenu.length === 0" class="text-center py-6 text-xs text-slate-400">
          इस ढाबे का मेन्यू अभी अपडेट हो रहा है।
        </div>
      </div>

    </div>
  </div>

  <!-- 7. रिव्यू पॉपअप मोडल -->
  <div x-show="activeHotelForReview" class="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
    <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 max-h-[90vh] overflow-y-auto space-y-4 shadow-2xl">
      <div class="flex justify-between items-start border-b pb-2">
        <div>
          <span class="text-[10px] uppercase font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">पब्लिक रिव्यू</span>
          <h3 class="text-base font-black text-slate-900 mt-1" x-text="activeHotelForReview?.name"></h3>
        </div>
        <button @click="activeHotelForReview = null" class="text-slate-400 hover:text-slate-700 text-lg font-bold bg-slate-100 rounded-full w-7 h-7 flex items-center justify-center">✕</button>
      </div>

      <!-- रेटिंग फॉर्म -->
      <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2.5">
        <h4 class="text-xs font-black text-slate-800">★ रेटिंग दें</h4>
        <div class="flex items-center gap-2">
          <template x-for="star in [1, 2, 3, 4, 5]" :key="star">
            <button @click="newReview.rating = star" type="button" class="text-2xl transition-transform active:scale-125" :class="star <= newReview.rating ? 'text-amber-400' : 'text-slate-300'">★</button>
          </template>
        </div>
        <input type="text" x-model="newReview.userName" placeholder="आपका पूरा नाम *" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600">
        <input type="email" x-model="newReview.userEmail" placeholder="ईमेल आईडी *" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600 font-mono">
        <textarea x-model="newReview.comment" rows="2" placeholder="अपना अनुभव लिखें (कमरे, स्वच्छता, भोजन आदि)..." class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs outline-none focus:border-indigo-600"></textarea>
        <button @click="submitReview()" :disabled="submittingReview" class="w-full bg-indigo-600 active:bg-indigo-700 text-white font-bold py-2.5 rounded-xl text-xs shadow flex items-center justify-center gap-2">
          <span x-show="!submittingReview">रिव्यू पोस्ट करें</span>
          <span x-show="submittingReview" class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        </button>
      </div>

      <!-- पूर्व रिव्यू सूची -->
      <div class="space-y-2">
        <h4 class="text-xs font-black text-slate-800">💬 सभी रिव्यूज़ (<span x-text="currentHotelReviews.length"></span>)</h4>
        <div class="space-y-2 max-h-48 overflow-y-auto pr-1">
          <template x-for="rev in currentHotelReviews" :key="rev.id">
            <div class="border border-slate-200 p-2.5 rounded-xl text-xs bg-white">
              <div class="flex justify-between font-bold">
                <span x-text="rev.user_name"></span>
                <span class="text-amber-500" x-text="'★'.repeat(rev.rating)"></span>
              </div>
              <p class="text-slate-700 mt-1" x-text="rev.comment || 'रेटिंग दर्ज की गई।'"></p>
            </div>
          </template>
          <div x-show="currentHotelReviews.length === 0" class="text-center py-4 text-xs text-slate-400">
            अभी कोई रिव्यू नहीं है। पहले समीक्षक बनें!
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TURSO_PIPELINE_URL = "https://expresswaystay-govindaala.aws-ap-south-1.turso.io/v2/pipeline";
    const TURSO_AUTH_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODg5OTE1MzIsImlkIjoiMDFhMDg4MzItM2UwMS03NGY5LTk3NTQtYTg4YjBkZTAyMTA1Iiwia2lkIjoiV0JkNlJ2dHFndUYtOHV1R2tnT0xSWWREU0lCaGVOem8xVy1QNXhBWkNVVSIsInJpZCI6ImE5OWVlZTcxLTNkZGItNDMzMi1hZDU5LTQzZmU4NWIwNjBhNiJ9.2igLL_0RTRvj6QJIq7enEUqoKFkx-v0OOpcL4Gc6dFzdYp3nDfaKyp740YD4B1e5cPnpIbHAy4ihec0vEdgcBg";

    function travellerPortal() {
      return {
        hotels: [],
        reviews: [],
        loading: true,
        activeCategory: 'hotel',
        searchQuery: '',
        userLat: null,
        userLon: null,
        activeHotelForReview: null,
        activeHotelForMenu: null,
        currentHotelReviews: [],
        currentHotelMenu: [],
        selectedMenuCategory: 'all',
        submittingReview: false,
        newReview: { rating: 5, userName: '', userEmail: '', comment: '' },

        async initPortal() {
          this.getUserGps();
          await this.fetchAllData();
        },

        async refreshAll() {
          await this.fetchAllData();
        },

        getUserGps() {
          if (!navigator.geolocation) return;
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              this.userLat = pos.coords.latitude;
              this.userLon = pos.coords.longitude;
            },
            () => {},
            { enableHighAccuracy: true, timeout: 10000 }
          );
        },

        async executeTurso(sqlQuery) {
          const res = await fetch(TURSO_PIPELINE_URL, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${TURSO_AUTH_TOKEN.trim()}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              requests: [
                { type: "execute", stmt: { sql: sqlQuery } },
                { type: "close" }
              ]
            })
          });
          const data = await res.json();
          if (data.results && data.results[0]?.response?.result) {
            const execRes = data.results[0].response.result;
            const cols = (execRes.cols || []).map(c => c.name);
            return (execRes.rows || []).map(row => {
              const obj = {};
              row.forEach((cell, idx) => { obj[cols[idx]] = cell.value; });
              return obj;
            });
          }
          return [];
        },

        async fetchAllData() {
          this.loading = true;
          try {
            const hotelRows = await this.executeTurso("SELECT * FROM hotels WHERE is_active = 1");
            let reviewRows = [];
            try {
              reviewRows = await this.executeTurso("SELECT * FROM reviews ORDER BY id DESC");
            } catch (e) {}
            this.reviews = reviewRows;

            this.hotels = hotelRows.map(h => {
              const hReviews = this.reviews.filter(r => r.hotel_id === h.login_id);
              const count = hReviews.length;
              const avg = count > 0 ? (hReviews.reduce((sum, r) => sum + Number(r.rating), 0) / count) : null;
              return {
                ...h,
                category: h.category || 'both',
                food_type: h.food_type || 'veg',
                ac_rooms_available: Number(h.ac_rooms_available) || 0,
                ac_rooms_total: Number(h.ac_rooms_total) || 0,
                ac_price: Number(h.ac_price) || 0,
                non_ac_rooms_available: Number(h.non_ac_rooms_available) || 0,
                non_ac_rooms_total: Number(h.non_ac_rooms_total) || 0,
                non_ac_price: Number(h.non_ac_price) || 0,
                avgRating: avg,
                reviewCount: count
              };
            });
          } catch (e) {
            console.error(e);
          } finally {
            this.loading = false;
          }
        },

        calculateDistance(lat1, lon1, lat2, lon2) {
          if (!lat1 || !lon1 || !lat2 || !lon2) return null;
          const R = 6371;
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLon = (lon2 - lon1) * Math.PI / 180;
          const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                    Math.sin(dLon / 2) * Math.sin(dLon / 2);
          const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
          return parseFloat((R * c).toFixed(1));
        },

        get sortedAndFilteredList() {
          const q = this.searchQuery.trim().toLowerCase();
          return this.hotels
            .filter(item => {
              const matchCat = (this.activeCategory === 'restaurant')
                ? (item.category === 'restaurant' || item.category === 'both')
                : (item.category === 'hotel' || item.category === 'both');
              const matchQuery = !q || (item.name && item.name.toLowerCase().includes(q)) || (item.city && item.city.toLowerCase().includes(q));
              return matchCat && matchQuery;
            })
            .map(item => {
              let dist = null;
              if (this.userLat && this.userLon && item.lat && item.lon) {
                dist = this.calculateDistance(this.userLat, this.userLon, Number(item.lat), Number(item.lon));
              }
              return { ...item, distanceKm: dist };
            })
            .sort((a, b) => {
              if (a.distanceKm !== null && b.distanceKm !== null) return a.distanceKm - b.distanceKm;
              if (a.distanceKm !== null) return -1;
              if (b.distanceKm !== null) return 1;
              return 0;
            });
        },

        get hotelMenuCategories() {
          if (!this.currentHotelMenu) return [];
          const cats = this.currentHotelMenu.map(d => d.category || 'मेन कोर्स (सब्जी)').filter(Boolean);
          return [...new Set(cats)];
        },

        get filteredHotelMenu() {
          if (!this.currentHotelMenu) return [];
          if (this.selectedMenuCategory === 'all') return this.currentHotelMenu;
          return this.currentHotelMenu.filter(d => (d.category || 'मेन कोर्स (सब्जी)') === this.selectedMenuCategory);
        },

        async openMenuModal(hotel) {
          this.activeHotelForMenu = hotel;
          this.selectedMenuCategory = 'all';
          try {
            const rows = await this.executeTurso(`SELECT * FROM menu_items WHERE hotel_id = '${hotel.login_id}' ORDER BY id DESC`);
            this.currentHotelMenu = rows || [];
          } catch (e) {
            this.currentHotelMenu = [];
          }
        },

        openReviewModal(hotel) {
          this.activeHotelForReview = hotel;
          this.currentHotelReviews = this.reviews.filter(r => r.hotel_id === hotel.login_id);
          this.newReview = { rating: 5, userName: '', userEmail: '', comment: '' };
        },

        async submitReview() {
          if (!this.newReview.userName || !this.newReview.userEmail) return alert('नाम व ईमेल दर्ज करें!');
          this.submittingReview = true;
          const cName = this.newReview.userName.trim().replace(/'/g, "''");
          const cEmail = this.newReview.userEmail.trim().replace(/'/g, "''");
          const cComm = (this.newReview.comment || '').trim().replace(/'/g, "''");
          
          try {
            await this.executeTurso(`CREATE TABLE IF NOT EXISTS reviews (
              id INTEGER PRIMARY KEY AUTOINCREMENT,
              hotel_id TEXT NOT NULL,
              user_name TEXT NOT NULL,
              user_email TEXT NOT NULL,
              rating INTEGER NOT NULL,
              comment TEXT,
              created_at DATETIME DEFAULT CURRENT_TIMESTAMP
            )`);

            const sql = `INSERT INTO reviews (hotel_id, user_name, user_email, rating, comment)
                         VALUES ('${this.activeHotelForReview.login_id}', '${cName}', '${cEmail}', ${this.newReview.rating}, '${cComm}')`;
            await this.executeTurso(sql);
            alert('✅ रिव्यू दर्ज हो गया!');
            await this.fetchAllData();
            this.currentHotelReviews = this.reviews.filter(r => r.hotel_id === this.activeHotelForReview.login_id);
            this.newReview = { rating: 5, userName: '', userEmail: '', comment: '' };
          } catch (e) {
            alert('त्रुटि: ' + e.message);
          } finally {
            this.submittingReview = false;
          }
        }
      };
    }
  </script>
