<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Expressway Stay | Delhi-Mumbai Expressway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 pb-20" x-data="travellerPortal()" x-init="fetchLiveHotels()" x-cloak>

  <!-- हेडर -->
  <header class="bg-slate-950 text-white px-4 py-3 flex items-center justify-between text-xs sticky top-0 z-50 border-b border-slate-800 shadow-md">
    <div class="flex items-center gap-2 font-bold tracking-wide">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <span>EXPRESSWAY STAY LIVE</span>
    </div>
    <button @click="fetchLiveHotels()" class="text-[11px] bg-slate-800 active:bg-slate-700 text-slate-300 px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1">
      🔄 रीफ़्रेश
    </button>
  </header>

  <main class="max-w-md mx-auto p-4">
    <!-- मुख्य एक्सप्रेसवे बैनर -->
    <div class="bg-gradient-to-r from-amber-500 to-amber-600 rounded-2xl p-4 text-slate-950 shadow-md mb-4">
      <h1 class="text-lg font-black flex items-center gap-2">
        <span>🛣️</span> Delhi–Mumbai Expressway
      </h1>
      <p class="text-xs font-semibold text-amber-950 mt-1">
        नजदीकी होटल, ढाबा और लाइव खाली कमरों की स्थिति
      </p>
    </div>

    <!-- लोकेशन फ़िल्टर -->
    <div class="mb-4">
      <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider block mb-1">एक्सप्रेसवे कट / शहर चुनें:</label>
      <select x-model="selectedCity" class="w-full bg-white border border-slate-300 rounded-xl p-2.5 text-xs font-bold text-slate-800 shadow-sm outline-none">
        <option value="ALL">सभी लोकेशन (All Locations)</option>
        <option value="Dausa">दौसा (Dausa Exit)</option>
        <option value="Sawai Madhopur">सवाई माधोपुर (Ranthambore Cut)</option>
        <option value="Kota">कोटा / मुकुंदरा (Kota Exit)</option>
        <option value="Ratlam">रतलाम (MP Section)</option>
        <option value="Vadodara">वडोदरा / भरूच (Gujarat Exit)</option>
      </select>
    </div>

    <!-- लोडिंग इंडिकेटर -->
    <div x-show="loading" class="text-center py-10">
      <div class="inline-block w-8 h-8 border-4 border-slate-300 border-t-slate-900 rounded-full animate-spin"></div>
      <p class="text-xs text-slate-500 mt-2 font-medium">Turso डेटाबेस से कनेक्ट हो रहा है...</p>
    </div>

    <!-- होटल सूची -->
    <div x-show="!loading" class="space-y-4">
      <template x-for="hotel in filteredHotels" :key="hotel.id">
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200">
          <div class="flex justify-between items-start gap-2">
            <div>
              <div class="flex items-center gap-1.5">
                <h3 class="font-extrabold text-base text-slate-900" x-text="hotel.name"></h3>
                <span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-1.5 py-0.5 rounded">✓ Verified</span>
              </div>
              <p class="text-xs text-slate-500 mt-0.5" x-text="'📍 ' + hotel.city + ' कट'"></p>
            </div>
            <div class="text-right whitespace-nowrap">
              <span class="text-[10px] text-slate-400 block font-medium">किराया शुरुआती</span>
              <span class="text-base font-extrabold text-emerald-600" x-text="'₹' + (hotel.starting_price || 1500)"></span>
            </div>
          </div>

          <!-- लाइव रूम उपलब्धता कार्ड -->
          <div class="mt-3 p-3 rounded-xl border flex items-center justify-between"
               :class="Number(hotel.available_rooms) > 0 ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full" :class="Number(hotel.available_rooms) > 0 ? 'bg-emerald-500 animate-pulse' : 'bg-rose-500'"></span>
              <span class="text-xs font-extrabold"
                    :class="Number(hotel.available_rooms) > 0 ? 'text-emerald-900' : 'text-rose-900'"
                    x-text="Number(hotel.available_rooms) > 0 ? '🟢 ' + hotel.available_rooms + ' कमरे अभी खाली हैं' : '🔴 सभी कमरे भरे हुए हैं'">
              </span>
            </div>
            <span class="text-[10px] font-bold text-slate-400">Turso Live Sync</span>
          </div>

          <!-- क्विक एक्शन बटन -->
          <div class="grid grid-cols-3 gap-2 mt-4 pt-2 border-t border-slate-100">
            <a :href="'tel:' + hotel.phone" class="flex items-center justify-center gap-1 bg-slate-900 active:bg-black text-white text-xs font-bold py-2.5 rounded-xl">
              📞 Call
            </a>
            <a :href="'https://wa.me/91' + hotel.phone + '?text=' + encodeURIComponent('नमस्ते ' + hotel.name + ', एक्सप्रेसवे स्टे पर आपके खाली कमरे दिखे। क्या बुकिंग मिल सकती है?')" target="_blank" class="flex items-center justify-center gap-1 bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl">
              💬 WhatsApp
            </a>
            <a :href="'https://maps.google.com/?q=' + encodeURIComponent(hotel.name + ' ' + hotel.city)" target="_blank" class="flex items-center justify-center gap-1 bg-blue-600 active:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl">
              📍 Map
            </a>
          </div>
        </div>
      </template>

      <!-- कोई होटल न मिलने पर -->
      <div x-show="filteredHotels.length === 0" class="text-center py-10 bg-white rounded-2xl border border-slate-200">
        <p class="text-xs text-slate-500">इस लोकेशन पर अभी कोई होटल लिस्टेड नहीं है।</p>
      </div>
    </div>
  </main>

  <script>
    // Turso कॉन्फ़िगरेशन
    const TURSO_PIPELINE_URL = "https://expresswaystay-govindaala.aws-ap-south-1.turso.io/v2/pipeline";
    const TURSO_AUTH_TOKEN = "eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJhIjoicnciLCJpYXQiOjE3ODg5OTE1MzIsImlkIjoiMDFhMDg4MzItM2UwMS03NGY5LTk3NTQtYTg4YjBkZTAyMTA1Iiwia2lkIjoiV0JkNlJ2dHFndUYtOHV1R2tnT0xSWWREU0lCaGVOem8xVy1QNXhBWkNVVSIsInJpZCI6ImE5OWVlZTcxLTNkZGItNDMzMi1hZDU5LTQzZmU4NWIwNjBhNiJ9.2igLL_0RTRvj6QJIq7enEUqoKFkx-v0OOpcL4Gc6dFzdYp3nDfaKyp740YD4B1e5cPnpIbHAy4ihec0vEdgcBg"; // <-- यहाँ अपना Create Token वाला कोड पेस्ट करें

    function travellerPortal() {
      return {
        selectedCity: 'ALL',
        hotels: [],
        loading: false,

        async fetchLiveHotels() {
          this.loading = true;
          try {
            const res = await fetch(TURSO_PIPELINE_URL, {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${TURSO_AUTH_TOKEN}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                requests: [
                  { type: "execute", stmt: { sql: "SELECT * FROM hotels WHERE is_active = 1 ORDER BY id DESC" } },
                  { type: "close" }
                ]
              })
            });

            const data = await res.json();
            const execRes = data.results[0].response.result;
            const colNames = execRes.cols.map(c => c.name);

            // Turso के rows को ऑब्जेक्ट में बदलना
            this.hotels = execRes.rows.map(row => {
              const obj = {};
              row.forEach((cell, idx) => {
                obj[colNames[idx]] = cell.value;
              });
              return obj;
            });
          } catch (err) {
            console.error("Turso Connection Error:", err);
          } finally {
            this.loading = false;
          }
        },

        get filteredHotels() {
          if (this.selectedCity === 'ALL') return this.hotels;
          return this.hotels.filter(h => h.city === this.selectedCity);
        }
      };
    }
  </script>
</body>
</html>
